```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sajid's Website 🚀</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1>Welcome to Sajid's Website 🚀</h1>

        <p>Download files from my website</p>

        <!-- Download Area -->
        <div class="download-box">

            <h2>📁 My File</h2>

            <p>Click below to download the file.</p>

            <button onclick="downloadFile('photo.jpg')">
                📥 Download Photo
            </button>

        </div>

        <!-- User Area -->
        <div id="userArea" class="user-area hidden">

            <p id="userText"></p>

            <button class="logout-btn" onclick="logout()">
                🚪 Logout
            </button>

        </div>

    </div>


    <!-- Login/Register Popup -->

    <div id="authPopup" class="popup hidden">

        <div class="popup-box">

            <button class="close-btn" onclick="closeAuth()">
                ✕
            </button>


            <!-- Login -->

            <div id="loginForm">

                <h2>🔐 Login</h2>

                <input
                    type="text"
                    id="loginUser"
                    placeholder="Username or Gmail"
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                >

                <button onclick="login()">
                    Login & Download
                </button>

                <p class="switch">
                    Don't have an account?
                    <span onclick="showRegister()">Register</span>
                </p>

            </div>


            <!-- Register -->

            <div id="registerForm" class="hidden">

                <h2>📝 Register</h2>

                <input
                    type="text"
                    id="registerUsername"
                    placeholder="Username"
                >

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Gmail"
                >

                <input
                    type="password"
                    id="registerPassword"
                    placeholder="Password"
                >

                <input
                    type="password"
                    id="registerConfirm"
                    placeholder="Confirm Password"
                >

                <button onclick="register()">
                    Create Account & Download
                </button>

                <p class="switch">
                    Already have an account?
                    <span onclick="showLogin()">Login</span>
                </p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
```
